<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panneau d'Administration - Gestion Utilisateurs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --dark: #1f2937;
            --light: #f9fafb;
            --border: #e5e7eb;
            --text: #111827;
            --text-light: #6b7280;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title i {
            font-size: 2rem;
            color: var(--primary);
        }

        .header-title h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--dark);
            margin: 0;
        }

        .header-title p {
            color: var(--text-light);
            font-size: 0.875rem;
            margin-top: 4px;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header h2 i {
            color: var(--primary);
        }

        /* Forms */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark);
            font-weight: 500;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--light);
            border-radius: 8px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .checkbox-wrapper label {
            margin: 0;
            text-transform: none;
            cursor: pointer;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn i {
            font-size: 0.875rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--text-light);
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.75rem;
        }

        /* User List */
        .users-grid {
            display: grid;
            gap: 20px;
        }

        .user-card {
            background: var(--light);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s;
        }

        .user-card:hover {
            border-color: var(--primary);
            transform: translateX(5px);
            box-shadow: var(--shadow-lg);
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .user-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-name i {
            color: var(--primary);
            font-size: 1.125rem;
        }

        .badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge-active {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-expired {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-valid {
            background: #dbeafe;
            color: #1e40af;
        }

        .user-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .info-value {
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-value i {
            color: var(--primary);
            font-size: 0.875rem;
        }

        .time-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .time-badge.expired {
            background: #fee2e2;
            color: #991b1b;
        }

        .time-badge.valid {
            background: #d1fae5;
            color: #065f46;
        }

        .user-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 20px;
            border-top: 2px solid var(--border);
        }

        /* Messages */
        .message {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: none;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .message.show {
            display: flex;
            animation: slideDown 0.3s ease;
        }

        .message-success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }

        .message-error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .message i {
            font-size: 1.25rem;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading & Empty States */
        .loading, .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .loading i, .empty-state i {
            font-size: 3rem;
            color: var(--text-light);
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.125rem;
            font-weight: 500;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header h2 i {
            color: var(--primary);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .close-modal:hover {
            background: var(--light);
            color: var(--danger);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .user-header {
                flex-direction: column;
            }

            .user-actions {
                flex-direction: column;
            }

            .user-actions .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <div>
                    <h1><i class="fas fa-users-cog"></i> Panneau d'Administration</h1>
                    <p>Gestion des utilisateurs et abonnements</p>
                </div>
            </div>
        </div>

        <div id="message" class="message"></div>

        <!-- Formulaire de création -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-user-plus"></i> Nouvel Utilisateur</h2>
            </div>
            <form id="createForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nom"><i class="fas fa-user"></i> Nom complet</label>
                        <input type="text" id="nom" name="nom" required placeholder="Ex: ELOLA Abdou">
                    </div>
                    <div class="form-group">
                        <label for="telephone"><i class="fas fa-phone"></i> Téléphone</label>
                        <input type="text" id="telephone" name="telephone" required placeholder="Ex: 76391454">
                    </div>
                    <div class="form-group">
                        <label for="dateExpiration"><i class="fas fa-calendar-alt"></i> Date d'expiration</label>
                        <input type="date" id="dateExpiration" name="dateExpiration" required>
                    </div>
                    <div class="form-group">
                        <label for="heureExpiration"><i class="fas fa-clock"></i> Heure d'expiration</label>
                        <input type="time" id="heureExpiration" name="heureExpiration" required>
                    </div>
                </div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="actif" name="actif" checked>
                    <label for="actif">Utilisateur actif</label>
                </div>
                <div style="margin-top: 25px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Créer
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">
                        <i class="fas fa-redo"></i> Réinitialiser
                    </button>
                </div>
            </form>
        </div>

        <!-- Liste des utilisateurs -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-list"></i> Liste des Utilisateurs</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary btn-sm" onclick="copyAllPhones()" type="button">
                        <i class="fas fa-copy"></i> Copier les téléphones
                    </button>
                    <button class="btn btn-success btn-sm" onclick="loadDocuments()">
                        <i class="fas fa-sync-alt"></i> Actualiser
                    </button>
                </div>
            </div>
            <div id="documentsList" class="users-grid">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Chargement en cours...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal pour modification -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Modifier l'Utilisateur</h2>
                <button class="close-modal" onclick="closeEditModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editNom"><i class="fas fa-user"></i> Nom complet</label>
                    <input type="text" id="editNom" required>
                </div>
                <div class="form-group">
                    <label for="editTelephone"><i class="fas fa-phone"></i> Téléphone</label>
                    <input type="text" id="editTelephone" required>
                </div>
                <div class="form-group">
                    <label for="editDateExpiration"><i class="fas fa-calendar-alt"></i> Date d'expiration</label>
                    <input type="date" id="editDateExpiration" required>
                </div>
                <div class="form-group">
                    <label for="editHeureExpiration"><i class="fas fa-clock"></i> Heure d'expiration</label>
                    <input type="time" id="editHeureExpiration" required>
                </div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="editActif">
                    <label for="editActif">Utilisateur actif</label>
                </div>
                <div style="margin-top: 25px; display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal pour modification de date uniquement -->
    <div id="dateModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-calendar-check"></i> Modifier la Date d'Expiration</h2>
                <button class="close-modal" onclick="closeDateModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="dateForm">
                <input type="hidden" id="dateId">
                <div class="form-group">
                    <label for="newDateExpiration"><i class="fas fa-calendar-alt"></i> Nouvelle date d'expiration</label>
                    <input type="date" id="newDateExpiration" required>
                </div>
                <div class="form-group">
                    <label for="newHeureExpiration"><i class="fas fa-clock"></i> Nouvelle heure d'expiration</label>
                    <input type="time" id="newHeureExpiration">
                </div>
                <div style="margin-top: 25px; display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Modifier
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeDateModal()">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Charger les utilisateurs au chargement de la page
        window.addEventListener('DOMContentLoaded', () => {
            loadDocuments();
        });

        // Gestion du formulaire de création
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {
                nom: formData.get('nom'),
                telephone: formData.get('telephone'),
                dateExpiration: formData.get('dateExpiration'),
                heureExpiration: formData.get('heureExpiration'),
                actif: document.getElementById('actif').checked
            };

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    showMessage('<i class="fas fa-check-circle"></i> Utilisateur créé avec succès!', 'success');
                    e.target.reset();
                    loadDocuments();
                } else {
                    showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + result.error, 'error');
                }
            } catch (error) {
                showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + error.message, 'error');
            }
        });

        // Charger tous les utilisateurs
        async function loadDocuments() {
            const listDiv = document.getElementById('documentsList');
            listDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Chargement en cours...</p></div>';

            try {
                const response = await fetch('/api/users');
                const result = await response.json();

                if (result.success) {
                    if (result.data.length === 0) {
                        listDiv.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-users"></i>
                                <p>Aucun utilisateur trouvé</p>
                            </div>
                        `;
                    } else {
                        listDiv.innerHTML = result.data.map(user => createDocumentCard(user)).join('');
                    }
                } else {
                    showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + result.error, 'error');
                }
            } catch (error) {
                listDiv.innerHTML = `<div class="message message-error show"><i class="fas fa-exclamation-circle"></i> Erreur: ${error.message}</div>`;
            }
        }

        // Créer une carte d'utilisateur
        function createDocumentCard(user) {
            const date = new Date(user.dateExpiration);
            const dateStr = date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const createdAt = new Date(user.createdAt).toLocaleString('fr-FR');
            const updatedAt = user.updatedAt ? new Date(user.updatedAt).toLocaleString('fr-FR') : '-';
            const isExpired = user.isExpired || false;
            const timeRemaining = user.timeRemaining || 'N/A';

            return `
                <div class="user-card">
                    <div class="user-header">
                        <div class="user-name">
                            <i class="fas fa-user"></i> ${user.nom}
                        </div>
                        <div class="badges">
                            <span class="badge ${user.actif ? 'badge-active' : 'badge-inactive'}">
                                <i class="fas ${user.actif ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                                ${user.actif ? 'Actif' : 'Inactif'}
                            </span>
                            <span class="badge ${isExpired ? 'badge-expired' : 'badge-valid'}">
                                <i class="fas ${isExpired ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i>
                                ${isExpired ? 'Expiré' : 'Valide'}
                            </span>
                        </div>
                    </div>
                    <div class="user-info">
                        <div class="info-item">
                            <span class="info-label">Téléphone</span>
                            <span class="info-value"><i class="fas fa-phone"></i> ${user.telephone}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Date d'expiration</span>
                            <span class="info-value"><i class="fas fa-calendar-alt"></i> ${dateStr} à ${user.heureExpiration}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Temps restant</span>
                            <span class="time-badge ${isExpired ? 'expired' : 'valid'}">
                                <i class="fas ${isExpired ? 'fa-clock' : 'fa-hourglass-half'}"></i>
                                ${timeRemaining}
                            </span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Créé le</span>
                            <span class="info-value"><i class="fas fa-calendar-plus"></i> ${createdAt}</span>
                        </div>
                        ${updatedAt !== '-' ? `
                        <div class="info-item">
                            <span class="info-label">Modifié le</span>
                            <span class="info-value"><i class="fas fa-edit"></i> ${updatedAt}</span>
                        </div>
                        ` : ''}
                    </div>
                    <div class="user-actions">
                        <button class="btn btn-warning btn-sm" onclick="openEditModal('${user._id}')">
                            <i class="fas fa-edit"></i> Modifier
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="openDateModal('${user._id}')">
                            <i class="fas fa-calendar-check"></i> Modifier date
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteDocument('${user._id}')">
                            <i class="fas fa-trash"></i> Supprimer
                        </button>
                    </div>
                </div>
            `;
        }

        // Ouvrir le modal d'édition
        async function openEditModal(id) {
            try {
                const response = await fetch(`/api/users/${id}`);
                const result = await response.json();

                if (result.success) {
                    const doc = result.data;
                    document.getElementById('editId').value = doc._id;
                    document.getElementById('editNom').value = doc.nom;
                    document.getElementById('editTelephone').value = doc.telephone;
                    const date = new Date(doc.dateExpiration);
                    document.getElementById('editDateExpiration').value = date.toISOString().split('T')[0];
                    document.getElementById('editHeureExpiration').value = doc.heureExpiration;
                    document.getElementById('editActif').checked = doc.actif;
                    document.getElementById('editModal').classList.add('show');
                }
            } catch (error) {
                showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + error.message, 'error');
            }
        }

        // Fermer le modal d'édition
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        // Gestion du formulaire d'édition
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                nom: document.getElementById('editNom').value,
                telephone: document.getElementById('editTelephone').value,
                dateExpiration: document.getElementById('editDateExpiration').value,
                heureExpiration: document.getElementById('editHeureExpiration').value,
                actif: document.getElementById('editActif').checked
            };

            try {
                const response = await fetch(`/api/users/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    showMessage('<i class="fas fa-check-circle"></i> Utilisateur modifié avec succès!', 'success');
                    closeEditModal();
                    loadDocuments();
                } else {
                    showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + result.error, 'error');
                }
            } catch (error) {
                showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + error.message, 'error');
            }
        });

        // Ouvrir le modal de modification de date
        async function openDateModal(id) {
            try {
                const response = await fetch(`/api/users/${id}`);
                const result = await response.json();

                if (result.success) {
                    const doc = result.data;
                    document.getElementById('dateId').value = doc._id;
                    const date = new Date(doc.dateExpiration);
                    document.getElementById('newDateExpiration').value = date.toISOString().split('T')[0];
                    document.getElementById('newHeureExpiration').value = doc.heureExpiration;
                    document.getElementById('dateModal').classList.add('show');
                }
            } catch (error) {
                showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + error.message, 'error');
            }
        }

        // Fermer le modal de date
        function closeDateModal() {
            document.getElementById('dateModal').classList.remove('show');
        }

        // Gestion du formulaire de modification de date
        document.getElementById('dateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('dateId').value;
            const data = {
                dateExpiration: document.getElementById('newDateExpiration').value,
                heureExpiration: document.getElementById('newHeureExpiration').value
            };

            try {
                const response = await fetch(`/api/users/${id}/date`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    showMessage('<i class="fas fa-check-circle"></i> Date modifiée avec succès!', 'success');
                    closeDateModal();
                    loadDocuments();
                } else {
                    showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + result.error, 'error');
                }
            } catch (error) {
                showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + error.message, 'error');
            }
        });

        // Supprimer un utilisateur
        async function deleteDocument(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ?')) {
                return;
            }

            try {
                const response = await fetch(`/api/users/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    showMessage('<i class="fas fa-check-circle"></i> Utilisateur supprimé avec succès!', 'success');
                    loadDocuments();
                } else {
                    showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + result.error, 'error');
                }
            } catch (error) {
                showMessage('<i class="fas fa-exclamation-circle"></i> Erreur: ' + error.message, 'error');
            }
        }

        // Copier tous les numéros de téléphone
        async function copyAllPhones() {
            try {
                const response = await fetch('/api/users');
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    // Extraire tous les numéros de téléphone
                    const phones = result.data.map(user => user.telephone);
                    const phonesText = phones.join('\n'); // Un numéro par ligne

                    // Méthode 1: API Clipboard moderne (si disponible)
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        try {
                            await navigator.clipboard.writeText(phonesText);
                            showMessage(
                                `<i class="fas fa-check-circle"></i> ${phones.length} numéro(s) de téléphone copié(s) dans le presse-papier!`, 
                                'success'
                            );
                            return;
                        } catch (clipboardError) {
                            console.log('API Clipboard échouée, utilisation de la méthode de secours');
                        }
                    }

                    // Méthode 2: Méthode de secours avec textarea
                    const textarea = document.createElement('textarea');
                    textarea.value = phonesText;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-999999px';
                    textarea.style.top = '-999999px';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    
                    try {
                        const successful = document.execCommand('copy');
                        document.body.removeChild(textarea);
                        
                        if (successful) {
                            showMessage(
                                `<i class="fas fa-check-circle"></i> ${phones.length} numéro(s) de téléphone copié(s) dans le presse-papier!`, 
                                'success'
                            );
                        } else {
                            throw new Error('La commande de copie a échoué');
                        }
                    } catch (copyError) {
                        document.body.removeChild(textarea);
                        throw copyError;
                    }
                } else {
                    showMessage(
                        '<i class="fas fa-exclamation-circle"></i> Aucun utilisateur trouvé', 
                        'error'
                    );
                }
            } catch (error) {
                console.error('Erreur lors de la copie:', error);
                showMessage(
                    '<i class="fas fa-exclamation-circle"></i> Erreur lors de la copie: ' + error.message + '. Vérifiez la console pour plus de détails.', 
                    'error'
                );
            }
        }

        // Réinitialiser le formulaire
        function resetForm() {
            document.getElementById('createForm').reset();
        }

        // Afficher un message
        function showMessage(html, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = html;
            messageDiv.className = `message message-${type} show`;
            setTimeout(() => {
                messageDiv.classList.remove('show');
            }, 4000);
        }

        // Fermer les modals en cliquant en dehors
        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('show');
            }
        });
    </script>
</body>
</html>
